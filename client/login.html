<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Unicon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>🎓 Unicon</h1>

    <div class="auth-container">
      <h2>Sign In</h2>
      <div class="form-group">
        <input id="logEmail" placeholder="Email" type="email" required>
        <input id="logPass" type="password" placeholder="Password" required>
        <button onclick="login()">Login</button>
      </div>

      <div class="divider"><span>Don't have an account? <a href="signup.html">Sign up</a></span></div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
