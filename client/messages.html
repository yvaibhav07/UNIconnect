<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Anonymous Campus</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
       /* ===== MESSAGES UI (UPGRADED) ===== */

        .messages-container {
        display: flex;
        max-width: 1140px;
        height: 85vh;
        margin: 20px auto;
        background: var(--card);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: var(--shadow-card);
        overflow: hidden;
        }

        /* LEFT PANEL */
        .conversations-list {
        width: 300px;
        background: var(--bg-secondary);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        }

        .conversations-header {
        padding: 16px;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
        background: var(--card);
        }

        .conversation-item {
        padding: 14px 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        border-bottom: 1px solid var(--border);
        }

        .conversation-item:hover {
        background: var(--primary-light);
        }

        .conversation-item.active {
        background: var(--primary);
        color: white;
        }

        .conversation-name {
        font-weight: 600;
        font-size: 14px;
        }

        .conversation-preview {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 4px;
        }

        .conversation-item.active .conversation-preview {
        color: rgba(255,255,255,0.8);
        }

        /* RIGHT PANEL */
        .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: linear-gradient(
            to bottom,
            #f8f9ff,
            #ffffff
        );
        }

        /* HEADER */
        .chat-header {
        padding: 16px;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
        background: var(--card);
        display: flex;
        align-items: center;
        justify-content: space-between;
        }

        /* MESSAGES */
        .messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        }

        /* MESSAGE BUBBLES */
        .message {
        max-width: 65%;
        display: flex;
        flex-direction: column;
        animation: fadeInUp 0.2s ease;
        }

        .message.sent {
        align-self: flex-end;
        }

        .message.received {
        align-self: flex-start;
        }

        .message-content {
        padding: 10px 14px;
        border-radius: var(--radius);
        font-size: 14px;
        line-height: 1.4;
        }

        /* SENT */
        .message.sent .message-content {
        background: var(--primary);
        color: white;
        border-bottom-right-radius: 4px;
        box-shadow: 0 2px 10px rgba(67,97,238,0.25);
        }

        /* RECEIVED */
        .message.received .message-content {
        background: var(--bg-secondary);
        color: var(--text-main);
        border-bottom-left-radius: 4px;
        }

        /* TIME */
        .message-time {
        font-size: 11px;
        color: var(--text-light);
        margin-top: 4px;
        padding: 0 4px;
        }

        /* INPUT AREA */
        .input-area {
        display: flex;
        gap: 10px;
        padding: 14px;
        border-top: 1px solid var(--border);
        background: var(--card);
        }

        .input-area input {
        flex: 1;
        border-radius: var(--radius-pill);
        padding: 10px 16px;
        font-size: 14px;
        }

        .input-area button {
        border-radius: var(--radius-pill);
        padding: 10px 18px;
        }

        /* EMPTY STATE */
        .empty-state {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-muted);
        font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="nav-links" style="padding: 20px 20px 0 20px;">
        <a href="dashboard.html">Dashboard</a>
        <a href="friends.html">Friends</a>
        <a href="messages.html">Messages</a>
        <a href="profile.html">Profile</a>
        <a href="login.html" onclick="logout()">Logout</a>
    </div>

    <div class="messages-container">
        <!-- Conversations List -->
        <div class="conversations-list">
            <div style="padding: 15px; background: white; border-bottom: 1px solid #ddd; font-weight: bold;">
                💬 Conversations
            </div>
            <div id="conversationsList"></div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div id="chatContent" class="empty-state">
                Select a conversation to start messaging
            </div>
            <div id="chatArea" style="display: none; flex: 1; display: flex; flex-direction: column;">
                <div class="chat-header" id="chatHeader"></div>
                <div class="messages" id="messagesArea"></div>
                <div class="input-area">
                    <input type="text" id="messageInput" placeholder="Type your message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/messages.js"></script>
</body>
</html>
