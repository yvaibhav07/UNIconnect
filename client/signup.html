<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Unicon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>🎓 Unicon</h1>

    <div class="auth-container">
      <h2>Create Account</h2>
      <div class="form-group">
        <input id="regEmail" placeholder="University Email" type="email" required>
        <input id="regPass" type="password" placeholder="Create Password" required>
        <button onclick="register()">Register</button>
      </div>

      <div class="divider"><span>Already have an account? <a href="login.html">Sign in</a></span></div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
