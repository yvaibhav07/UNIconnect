<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - UniCon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page-body">
  <div class="container">
    <h1>🎓 UniCon</h1>
    <div class="auth-container">
      <h2>Create Account</h2>
      <div class="form-group">
        <input id="regEmail" placeholder="University Email (.edu)" type="email" required>
        <input id="regPass" type="password" placeholder="Create Password (min 6 chars)" required>
        <button onclick="register()">Create Account →</button>
      </div>
      <div class="divider"><span>Already have an account? <a href="login.html">Sign in</a></span></div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
